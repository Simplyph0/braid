name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: ./build.sh && go test ./...
      - run: VERSION="$GITHUB_REF_NAME" ./build.sh release
      - name: Sign the builds
        run: go run ./cmd/braid-release -version "$GITHUB_REF_NAME" -dir dist/update
        env:
          BRAID_SIGNING_KEY: ${{ secrets.BRAID_SIGNING_KEY }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/simplyph0/braid-hub:latest,ghcr.io/simplyph0/braid-hub:${{ github.ref_name }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/update/* dist/hub-linux-amd64/braid-hub#braid-hub-linux-amd64 --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
