<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Braid</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
  --accent: #3a5bd9; --accent-text: #ffffff; --ok: #2f8a4c; --warn: #b26a00; --bad: #c0392b; --idle: #9a968f;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #201f1d; --text: #ecebe8; --muted: #a29e97; --line: #34322f;
    --accent: #8ea4ff; --accent-text: #10131f; --ok: #5cc27e; --warn: #f0a63a; --bad: #ff7a6b; --idle: #77736d;
    --chip: #2b2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
header h1 { font-size: 20px; margin: 0; flex: 1; overflow-wrap: anywhere; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
button.card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.card:hover { border-color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title { font-weight: 600; font-size: 16px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.problem { color: var(--bad); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
.waiting { color: var(--warn); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
select.btn { padding-right: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.moment { border-left: 2px solid var(--line); margin-left: 6px; padding: 2px 0 12px 16px; position: relative; }
.moment::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--muted); }
.moment.braid::before { border-color: var(--accent); background: var(--accent); }
.moment button.head { all: unset; cursor: pointer; display: block; width: 100%; }
.moment button.head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.files { font: 12.5px/1.5 ui-monospace, monospace; margin: 8px 0 0; padding: 0; list-style: none; overflow-wrap: anywhere; }
.files .added { color: var(--ok); } .files .removed { color: var(--bad); }
form label { display: block; margin: 14px 0 4px; font-weight: 600; }
input[type=text], input[type=password] { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.check { display: flex; gap: 8px; align-items: center; margin: 14px 0; font-weight: 400; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); display: none; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
a { color: var(--accent); }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
